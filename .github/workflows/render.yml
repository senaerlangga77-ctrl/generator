name: Buat Video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = percobaan 30 detik | topik = dari topik | file = dari file storyboard"
        type: choice
        options: [test, topik, file]
        default: test
      topik:
        description: "Judul/topik video (hanya untuk mode topik)"
        required: false
        default: ""
      menit:
        description: "Target durasi 5-10 menit (mode topik)"
        required: false
        default: "6"
      storyboard:
        description: "Nama file di folder storyboards, contoh: video_saya.json (mode file)"
        required: false
        default: ""
      ai_latar:
        description: "Coba latar dari layanan gambar gratis?"
        type: choice
        options: ["tidak", "ya"]
        default: "tidak"

permissions:
  contents: write

jobs:
  buat-video:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Ambil isi repo
        uses: actions/checkout@v4

      - name: Ekstrak proyek dari zip
        run: |
          ls -la
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "GALAT: tidak ada file .zip di halaman utama repo. Unggah proyek.zip dulu."; exit 1; fi
          python3 -m zipfile -e "$ZIP" .
          ls

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang FFmpeg dan pustaka
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Buat video
        env:
          MODE: ${{ inputs.mode }}
          TOPIK: ${{ inputs.topik }}
          MENIT: ${{ inputs.menit }}
          STORYBOARD: ${{ inputs.storyboard }}
          AI_LATAR: ${{ inputs.ai_latar }}
        run: |
          ARGS=(--mode "$MODE" --keluaran output/video.mp4)
          if [ "$MODE" = "topik" ]; then ARGS+=(--topik "$TOPIK" --menit "$MENIT"); fi
          if [ "$MODE" = "file" ]; then ARGS+=(--storyboard "storyboards/$STORYBOARD"); fi
          if [ "$AI_LATAR" = "ya" ]; then ARGS+=(--ai-latar); fi
          python run.py "${ARGS[@]}"

      - name: Simpan hasil (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: output/video.mp4

      - name: Terbitkan ke Releases (unduh langsung dari HP)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "video-${{ github.run_number }}" output/video.mp4 \
            --title "Video #${{ github.run_number }}" --notes "Dibuat otomatis oleh GitHub Actions."
